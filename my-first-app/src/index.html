<!DOCTYPE html>
<html ng-app="musicApp">
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        .highlight { background-color: #f0f0f0; border: 1px solid #007bff; }
        .song-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #ddd; }
        .active { color: green; font-weight: bold; }
    </style>
</head>
<body ng-controller="MusicController">

    <h1>🎵 My Music Player</h1>

    <input type="text" 
           placeholder="Search songs..." 
           ng-model="searchQuery"
           ng-focus="status = 'Searching...'" 
           ng-blur="status = 'Select a song'">
    
    <p>Status: <strong>{{ status }}</strong></p>

    <div class="playlist">
        <h3>Playlist</h3>
        <div class="song-item" 
             ng-repeat="song in songs | filter:searchQuery" 
             ng-mouseenter="hovering = true" 
             ng-mouseleave="hovering = false"
             ng-class="{'highlight': hovering}">
            
            <span>{{ song.title }} - {{ song.artist }}</span>
            
            <button ng-click="playSong(song)">Play</button>
        </div>
    </div>

    <hr>
    <div ng-if="currentSong">
        <p class="active">Now Playing: {{ currentSong.title }} by {{ currentSong.artist }}</p>
    </div>

    <script>
        var app = angular.module('musicApp', []);

        app.controller('MusicController', function($scope, $http) {
            $scope.status = "Select a song";
            $scope.songs = [];

            // Fetching the JSON file
            $http.get('playlist.json').then(function(response) {
                $scope.songs = response.data;
            });

            $scope.playSong = function(song) {
                $scope.currentSong = song;
                alert("Now playing: " + song.title);
            };
        });
    </script>
</body>
</html>
